services:
  goroute:
    image: ${GOROUTE_IMAGE:-ghcr.io/phamtanminhtien/goroute:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goroute
    environment:
      GOROUTE_ENV: production
    ports:
      - "12232:2232"
    volumes:
      - ./.data:/home/goroute/.goroute
    restart: unless-stopped

volumes:
  goroute-data:
